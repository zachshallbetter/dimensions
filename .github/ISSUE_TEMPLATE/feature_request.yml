name: Feature request
description: Propose a new capability or change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The behavior you want
      description: What should the scene or the controls do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you imagine it
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
