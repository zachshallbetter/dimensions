name: Bug report
description: Something in the project isn't behaving as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. A minimal reproduction is the fastest path to a fix.
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: a commit SHA
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps, a code snippet, or a link.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: browser and version, GPU / OS
